<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PayGuard — payment result</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">💳</span>
      <div>
        <h1>PayGuard</h1>
        <p class="tagline">AI-verified invoice payments — <strong>PayPal</strong> × <strong>Clocked</strong></p>
      </div>
    </div>
  </header>
  <main class="layout" style="grid-template-columns: 1fr; max-width: 900px;">
    <section class="panel">
      <div class="panel-head">
        <h2>Back from PayPal approval</h2>
        <p class="hint">Capturing your approved payment…</p>
      </div>
      <div id="alert-box" class="alert ok">Processing…</div>
      <p><a class="github-link" href="/">← Back to PayGuard</a></p>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
